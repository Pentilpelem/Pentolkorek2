<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>📱 NEW POST: Spend The Night With Me</title>
  <meta name="description" content="💬 45.9K Comments">

  <!-- Facebook / Open Graph Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="📱 NEW POST: Spend The Night With Me">
  <meta property="og:description" content="💬 45.9K Comments">
  <meta property="og:image" content="https://snipboard.io/poPDGk.jpg">
  <meta property="og:url" content="https://findyour-love.vercel.app/">

  <!-- Twitter / Social Preview -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Match Is Nearby 👀">
  <meta name="twitter:description" content="Ready to meet someone new?">
  <meta name="twitter:image" content="https://snipboard.io/Yne8k9.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(
          rgba(0, 0, 0, .48),
          rgba(0, 0, 0, .78)
        ),
        url("https://snipboard.io/Yne8k9.jpg")
        center / cover no-repeat;
    }

    .card {
      width: min(100%, 390px);
      padding: 34px 24px 30px;
      text-align: center;
      border-radius: 24px;
      background: rgba(18, 18, 18, .78);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .heart {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 62px;
      color: #ff4d6d;
      text-shadow: 0 0 28px rgba(255,77,109,.65);
      animation: heartbeat 1s ease-in-out infinite;
    }

    h1 {
      font-size: 23px;
      line-height: 1.3;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .message {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1.45;
      color: rgba(255,255,255,.76);
      transition: opacity .25s ease;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 22px;
    }

    .loader span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: .25;
      animation: bounce 1.2s infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: .18s;
    }

    .loader span:nth-child(3) {
      animation-delay: .36s;
    }

    .note {
      margin-top: 22px;
      font-size: 11px;
      color: rgba(255,255,255,.45);
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes bounce {
      0%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <div class="heart">♥</div>

      <h1>Your Match Is Nearby 👀</h1>

      <div class="message" id="message">
        Getting things ready...
      </div>

      <div class="loader" aria-label="Loading">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="note">
        Please wait a moment...
      </div>

    </section>
  </main>

  <script>
    const OFFER_URL = "https://girlsnaughty.fun/xzuc3x";

    const messages = [
      "Getting things ready...",
      "Preparing dating options near you...",
      "Almost there..."
    ];

    const messageElement = document.getElementById("message");

    let step = 0;

    const messageTimer = setInterval(() => {
      step++;

      if (step < messages.length) {
        messageElement.style.opacity = "0";

        setTimeout(() => {
          messageElement.textContent = messages[step];
          messageElement.style.opacity = "1";
        }, 180);
      }
    }, 650);

    setTimeout(() => {
      clearInterval(messageTimer);
      window.location.replace(OFFER_URL);
    }, 2000);
  </script>

</body>
</html>
