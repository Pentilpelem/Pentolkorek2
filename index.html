<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Match Is Nearby 👀</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #111;
    }

    body {
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.75)),
        url("https://snipboard.io/nXrsLG.jpg") center/cover no-repeat;
    }

    .loading-box {
      width: min(88%, 380px);
      padding: 34px 25px;
      text-align: center;
      color: white;
      border-radius: 24px;
      background: rgba(15,15,15,.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .heart {
      width: 62px;
      height: 62px;
      margin: 0 auto 22px;
      position: relative;
      animation: pulse 1s infinite;
    }

    .heart::before {
      content: "♥";
      font-size: 62px;
      line-height: 62px;
      color: #ff477e;
      text-shadow: 0 0 25px rgba(255,71,126,.65);
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .message {
      font-size: 15px;
      color: rgba(255,255,255,.78);
      min-height: 22px;
      transition: opacity .25s ease;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 22px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: .3;
      animation: dot 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes dot {
      0%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }
  </style>
</head>

<body>

  <main class="screen">
    <div class="loading-box">

      <div class="heart"></div>

      <h1>Your Match Is Nearby 👀</h1>

      <div class="message" id="message">
        Getting things ready...
      </div>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  </main>

  <script>
    const OFFER_URL = "https://fumifun.sbs/08xpia";

    const messages = [
      "Getting things ready...",
      "Finding dating options near you...",
      "Almost there..."
    ];

    const messageEl = document.getElementById("message");

    let index = 0;

    const messageTimer = setInterval(() => {
      index++;

      if (index < messages.length) {
        messageEl.style.opacity = "0";

        setTimeout(() => {
          messageEl.textContent = messages[index];
          messageEl.style.opacity = "1";
        }, 180);
      }
    }, 650);

    setTimeout(() => {
      clearInterval(messageTimer);
      window.location.replace(OFFER_URL);
    }, 2000);
  </script>

</body>
</html>
